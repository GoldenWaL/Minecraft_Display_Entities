name: Build Fabric Mod

on:
  push:
    branches:
      - main
      - feature/fabric-1.21.1-scale-wand
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Verify Gradle
        run: gradle --version

      - name: Build
        run: gradle --no-daemon clean build --stacktrace --info

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: suoxiao-jar
          path: build/libs/*.jar
          if-no-files-found: error
